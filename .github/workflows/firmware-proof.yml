# Checks the test proof in a pull request's description (CONTRIBUTING.md):
# a pull request that changes what the firmware host suite reads needs a proof,
# written by `python3 scripts/firmware_proof.py host`, for its exact head tree.
# The checker comes from the base branch, so a pull request cannot change how
# it is judged. It runs again when the description is edited; the host suite
# itself runs in "Verify firmware and publish updater redirect", and that run
# is the one that counts. A HIL section is the contributor's report: shown,
# never checked against a device here.
name: Firmware test proof
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: firmware-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  proof:
    name: Firmware test proof
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The pull request head, without the release binaries: the checker reads
      # git objects, the runner's suite list and SYNC.json.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /scripts/
            /firmware/SYNC.json
            /firmware/tests/
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          sparse-checkout: scripts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Check the proof
        run: |
          checker=trusted/scripts/firmware_proof.py
          if [ ! -f "$checker" ]; then
            echo "::warning::The base branch has no scripts/firmware_proof.py yet; using the pull request's own checker."
            checker=head/scripts/firmware_proof.py
          fi
          python3 "$checker" check --repo head --event "$GITHUB_EVENT_PATH" --summary "$GITHUB_STEP_SUMMARY"
