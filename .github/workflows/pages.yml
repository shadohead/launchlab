name: Verify firmware and publish updater redirect
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
        working-directory: site
      # The image's clang with ASan/UBSan, as on the development Macs and in
      # the private host suite: GCC treats byte-identical #pragma once headers
      # as one file, so test_shake_wake could not include the frozen 0.20.1
      # decoder beside today's. The kernel's 32 bits of mmap randomization
      # break ASan's shadow memory, so cap them as the runner images recommend.
      - name: Toolchain
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          echo "CXX=clang++" >> "$GITHUB_ENV"
          clang++ --version
      - run: bash scripts/test-firmware.sh
      - run: python3 scripts/verify-artifacts.py
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
