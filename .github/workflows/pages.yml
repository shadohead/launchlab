name: Verify firmware and publish updater redirect
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The firmware host suite (scripts/firmware_tests.py): every public suite of
  # this tree. A contributor's own run is recorded in their test proof (the
  # Firmware test proof workflow); this run is the one that counts.
  host-suite:
    name: Firmware host suite
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      # The image's clang with ASan/UBSan, as on the development Macs and in
      # the private host suite: GCC treats byte-identical #pragma once headers
      # as one file, so test_shake_wake could not include the frozen 0.20.1
      # decoder beside today's. The kernel's 32 bits of mmap randomization
      # break ASan's shadow memory, so cap them as the runner images recommend.
      - name: Toolchain
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          echo "CXX=clang++" >> "$GITHUB_ENV"
          clang++ --version
          python3 --version
      # check_ui_render draws every screen with the firmware's code on a real
      # M5GFX canvas: SDL2 headers for M5GFX's desktop platform (no window is
      # opened). The downloaded packages are cached per runner image.
      - name: Runner image
        run: echo "RUNNER_IMAGE=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_ENV"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ${{ runner.temp }}/apt-archives
          key: sdl2-debs-${{ runner.os }}-${{ env.RUNNER_IMAGE }}
          restore-keys: sdl2-debs-${{ runner.os }}-
      - name: SDL2
        timeout-minutes: 12
        run: |
          archives="$RUNNER_TEMP/apt-archives"
          mkdir -p "$archives/partial"
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            -o Dir::Cache::Archives="$archives" -o APT::Keep-Downloaded-Packages=true libsdl2-dev
          sudo rm -f "$archives/lock"
          sudo chown -R "$(id -u):$(id -g)" "$archives"
          sdl2-config --version
      # M5GFX at the commit the firmware builds with, cached by the fetch script's pin.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ${{ runner.temp }}/M5GFX
          key: m5gfx-${{ hashFiles('firmware/tools/ui_render/fetch_m5gfx.sh') }}
      - name: M5GFX
        timeout-minutes: 5
        run: |
          bash firmware/tools/ui_render/fetch_m5gfx.sh "$RUNNER_TEMP/M5GFX"
          echo "LAUNCHLAB_M5GFX=$RUNNER_TEMP/M5GFX" >> "$GITHUB_ENV"
      # Compile cache keyed on preprocessed sources (scripts/host_cc_cache.py);
      # the test binaries always run fresh. Every entry is content-addressed,
      # so a partial cache is still right: it is saved even when the suite fails.
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: firmware/build-host-suite/cc-cache
          key: host-suite-cc-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: host-suite-cc-${{ runner.os }}-
      - name: Host suite
        timeout-minutes: 30
        run: python3 scripts/firmware_tests.py --cache-mb 300 --result-json "$RUNNER_TEMP/host-suite.json"
      - name: Result
        if: always()
        run: cat "$RUNNER_TEMP/host-suite.json" || true
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        if: always() && hashFiles('firmware/build-host-suite/cc-cache/**') != ''
        with:
          path: firmware/build-host-suite/cc-cache
          key: host-suite-cc-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
        working-directory: site
      - run: python3 scripts/verify-artifacts.py
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: [host-suite, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
