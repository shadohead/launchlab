\* Baseline: the Wipe all contract as built.
\* Expected: no invariant, property or deadlock error.
\*
\*   java -cp tla2tools.jar tlc2.TLC -workers 1 -coverage 1 -config WipeContract.cfg WipeContract.tla
\*
\* Deadlock checking must stay on: do not pass -deadlock.

SPECIFICATION Spec

CONSTANTS
  NumOwned = 9
  ExtraTargets = 0
  AdapterEnforcesAllowlist = TRUE
  PersistIntentFirst = TRUE
  EnforceBudgets = TRUE
  MaxPowerCuts = 3
  MaxFaults = 3

INVARIANTS
  TypeOK
  ControlOK
  IntentDurableBeforeErase
  TornOnlyUnderIntent
  NormalRunsOnCleanStore
  CompleteMeansWiped
  ScopeRespected
  AuthorityBacksErase

PROPERTIES
  LocalInitiationOnly
  FailClosed
  TransactionsSettle
  IntentIsHonoured

\* Reachability witnesses (non-vacuity). In a scratch copy, uncomment ONE line
\* at a time. Each is expected to be reported as violated; the trace is the
\* witness. A witness that holds means the model cannot reach that state.
\* INVARIANT W_NeverValidMarker
\* INVARIANT W_NeverTorn
\* INVARIANT W_NeverComplete
\* INVARIANT W_NeverResumeErases
\* INVARIANT W_NeverBlockedInvalid
\* INVARIANT W_NeverFreshNormal
