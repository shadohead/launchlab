\* Mutation: the engine erases without first committing and reading back the
\* marker. The only difference from WipeContract.cfg is PersistIntentFirst.
\* The switch exists in the model alone: no firmware code, command or device
\* is involved.
\* Expected: the invariant IntentDurableBeforeErase is violated.
\*
\*   java -cp tla2tools.jar tlc2.TLC -workers 1 -config WipeMutation.cfg WipeContract.tla
\*
\* To see what the missing marker costs, comment out IntentDurableBeforeErase
\* (next predicted: TornOnlyUnderIntent), then that one too (next predicted:
\* NormalRunsOnCleanStore, a power cut followed by a normal boot on a partly
\* erased store).

